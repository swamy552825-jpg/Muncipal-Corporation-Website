<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Municipal Corporation</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <section class="login-section">

        <div class="login-card">

            <h2>
                Municipal Administration
            </h2>

            <p class="login-subtitle">
                Authorized Personnel Login
            </p>


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <form method="POST"
                  action="/admin-login">

                <label for="email">
                    Official Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter official email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >


                <button type="submit">
                    Administrator Login
                </button>

            </form>


            <p class="register-text">
                <a href="/login">
                    ← Citizen Login
                </a>
            </p>

        </div>

    </section>

</body>

</html>
